name: heteroes-minicloud
services:
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks: [cloud]
  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://minicloud:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/minicloud
      HETEROES_HEALTH_URL: ${HETEROES_HEALTH_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [cloud]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minicloud
      POSTGRES_USER: minicloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U minicloud -d minicloud']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [cloud]
  auth:
    image: quay.io/keycloak/keycloak:26.0
    command: [start-dev]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
    ports: ['127.0.0.1:18081:8080']
    restart: unless-stopped
    networks: [cloud]
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minicloudadmin
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD:?Set STORAGE_PASSWORD in .env}
    volumes: ['storage-data:/data']
    ports: ['127.0.0.1:19000:9000', '127.0.0.1:19001:9001']
    restart: unless-stopped
    networks: [cloud]
  dns:
    image: coredns/coredns:1.11.3
    command: ['-conf', '/etc/coredns/Corefile']
    volumes: ['./dns/Corefile:/etc/coredns/Corefile:ro']
    ports: ['127.0.0.1:11053:53/udp', '127.0.0.1:11053:53/tcp']
    restart: unless-stopped
    networks: [cloud]
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    networks: [cloud]
  web-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ['--nginx.scrape-uri=http://web:8080/stub_status']
    restart: unless-stopped
    networks: [cloud]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ['./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro', 'prometheus-data:/prometheus']
    ports: ['127.0.0.1:19090:9090']
    restart: unless-stopped
    networks: [cloud]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
    volumes: ['./grafana/provisioning:/etc/grafana/provisioning:ro', 'grafana-data:/var/lib/grafana']
    ports: ['127.0.0.1:13000:3000']
    restart: unless-stopped
    networks: [cloud]
  proxy:
    image: nginx:1.27-alpine
    volumes: ['./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:18080:80']
    depends_on: [web, app]
    restart: unless-stopped
    networks: [cloud]
networks:
  cloud:
    driver: bridge
volumes:
  db-data:
  storage-data:
  prometheus-data:
  grafana-data:
